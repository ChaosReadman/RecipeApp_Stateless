<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - NutriTrack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 共通のダークテーマ配色 */
        html, body {
            background-color: #11191f !important;
            color: #bbc6ce !important;
            margin: 0;
            padding: 0;
        }
        article {
            background-color: #1a232e !important;
            border: 1px solid #243342 !important;
        }
        table.striped thead th {
            background-color: #243342 !important;
        }

        /* 2カラムレイアウト（左2:右1）の統一定義 */
        @media (min-width: 992px) {
            .recipe-container {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: var(--pico-spacing);
                align-items: start;
            }
        }

        /* フォーム要素のダークモード調整 */
        input, select, textarea {
            background-color: #0d1419 !important;
            color: #fff !important;
            border-color: #243342 !important;
        }
    </style>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><a href="/ingredients/clear" class="contrast"><strong>NutriTrack</strong></a></li>
            </ul>
            <ul>
                <li><a href="/" class="secondary">Top</a></li>
                {{if .User}}
                <li><a href="/calendar" class="secondary">食事の記録</a></li>
                <span style="margin-right: 15px;">ようこそ、<strong>{{.User}}</strong> さん</span>
                <a href="/logout" role="button" class="outline secondary" style="font-size: 0.8rem;">ログアウト</a>
                {{else}}
                <a href="/auth/login" role="button" class="contrast" style="font-size: 0.8rem;">Googleでログイン</a>
                {{end}}
                
            </ul>
        </nav>
    </header>
    <main class="container">
        {{embed}}
    </main>
</body>
</html>
