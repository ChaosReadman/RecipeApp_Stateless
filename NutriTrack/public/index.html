<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .search-box { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h1>NutriTrack - 献立登録</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="食材を検索...">
        <button onclick="searchFood()">検索</button>
    </div>

    <div id="results">
        <p>検索結果がここに表示されます</p>
    </div>

    <script>
        async function searchFood() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');
            
            try {
                // localhostの代わりに 127.0.0.1 を使用して確実に接続する
                const response = await fetch(`http://127.0.0.1:8080/api/foods/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>結果が見つかりませんでした</p>';
                    return;
                }

                let html = '<table><thead><tr>';
                // 動的にカラムヘッダーを作成
                Object.keys(data[0]).forEach(key => html += `<th>${key}</th>`);
                html += '</tr></thead><tbody>';
                
                data.forEach(item => {
                    html += '<tr>' + Object.values(item).map(val => `<td>${val ?? ''}</td>`).join('') + '</tr>';
                });
                html += '</tbody></table>';
                resultsDiv.innerHTML = html;
            } catch (err) {
                resultsDiv.innerHTML = `<p style="color:red">エラーが発生しました: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
