<nav aria-label="breadcrumb">
    <ul>
        <li><a href="/">トップ</a></li>
        <li>レシピ詳細（調理モード）</li>
    </ul>
</nav>

<header>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>{{.Recipe.Title}}</h1>
        <a href="/recipe/{{.Recipe.ID}}/edit" role="button" class="secondary outline" style="font-size: 0.8rem; padding: 0.5rem 1rem;">このレシピを編集する</a>
    </div>
    <p>{{.Recipe.Description}}</p>

    <!-- 作り替え：分量セレクターをよりPico.cssらしく -->
    <article style="margin-bottom: var(--pico-spacing);">
        <div class="grid" style="align-items: center; grid-template-columns: auto 1fr auto;">
            <label for="servings" style="margin-bottom: 0;"><strong>作りたい分量:</strong></label>
            <input type="number" id="servings" value="1" min="0.1" step="0.1" style="margin-bottom: 0;" oninput="updateQuantities()">
            <span style="white-space: nowrap;">人分</span>
            <div></div> <!-- 余白調整用 -->
        </div>
    </article>
</header>

<div class="recipe-container">
    <!-- 左カラム: 材料と作り方 -->
    <div>
        <article>
            <header><strong>材料</strong></header>
            <table class="striped">
                <tbody>
                    {{range .Recipe.Ingredients}}
                    <tr>
                        <td>
                            {{if .GroupName}}<small>[{{.GroupName}}]</small> {{end}}{{.Name}}
                        </td>
                        <td style="text-align: right;">
                            <span class="qty-val" data-base="{{.Quantity}}">{{.Quantity}}</span> g/ml
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </article>

        <article>
            <header><strong>作り方</strong></header>
            <div id="steps-list">
                {{range .Recipe.Steps}}
                <p><strong>{{.StepNumber}}.</strong> {{.Instruction}}</p>
                <hr>
                {{end}}
            </div>
        </article>
    </div>

    <!-- 右カラム: 栄養素チャート -->
    <aside>
        <article>
            <header><strong>栄養バランス (1食目安)</strong></header>
            <div style="max-width: 100%; margin: 0 auto;">
                <canvas id="nutrientChart"></canvas>
            </div>
        </article>
    </aside>
</div>

<script>
// レーダーチャートの初期化
(function() {
    const ctx = document.getElementById('nutrientChart').getContext('2d');
    const summary = {
        energy: {{.Summary.Energy}},
        prot: {{.Summary.Prot}},
        fat: {{.Summary.Fat}},
        cho: {{.Summary.Cho}},
        k: {{.Summary.K}},
        ca: {{.Summary.Ca}},
        fe: {{.Summary.Fe}},
        zn: {{.Summary.Zn}},
        vitA: {{.Summary.VitA}},
        vitB: {{.Summary.VitB}},
        vitC: {{.Summary.VitC}},
        fiber: {{.Summary.Fiber}},
        salt: {{.Summary.Salt}}
    };

    const data = {
        labels: ['エネルギー', 'たんぱく質', '脂質', '炭水化物', 'カリウム', 'カルシウム', '鉄', '亜鉛', 'ビタミンA', 'ビタミンB', 'ビタミンC', '食物繊維', '食塩'],
        datasets: [{
            label: '充足率 (%)',
            data: [
                Math.min((summary.energy / 700) * 100, 120),
                Math.min((summary.prot / 20) * 100, 120),
                Math.min((summary.fat / 20) * 100, 120),
                Math.min((summary.cho / 100) * 100, 120),
                Math.min((summary.k / 800) * 100, 120),
                Math.min((summary.ca / 200) * 100, 120),
                Math.min((summary.fe / 2.5) * 100, 120),
                Math.min((summary.zn / 3.0) * 100, 120),
                Math.min((summary.vitA / 250) * 100, 120),
                Math.min((summary.vitB / 0.4) * 100, 120),
                Math.min((summary.vitC / 33) * 100, 120),
                Math.min((summary.fiber / 6.0) * 100, 120),
                Math.min((summary.salt / 2.5) * 100, 120)
            ],
            fill: true,
            backgroundColor: 'rgba(54, 162, 235, 0.2)',
            borderColor: 'rgb(54, 162, 235)',
            pointBackgroundColor: 'rgb(54, 162, 235)',
        }]
    };

    new Chart(ctx, {
        type: 'radar',
        data: data,
        options: {
            scales: {
                r: { suggestedMin: 0, suggestedMax: 100, ticks: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });
})();

function updateQuantities() {
    const servings = parseFloat(document.getElementById('servings').value) || 1;
    document.querySelectorAll('.qty-val').forEach(el => {
        const base = parseFloat(el.getAttribute('data-base')) || 0;
        el.innerText = (base * servings).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 1});
    });
}
</script>
